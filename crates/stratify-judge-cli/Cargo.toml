[package]
name = "stratify-judge-cli"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "stratify-judge"
path = "src/main.rs"

[dependencies]
stratify-judge-core = { path = "../stratify-judge-core" }
systemone-client = { path = "../systemone-client" }
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
wiremock = "0.6"
tempfile = "3"
